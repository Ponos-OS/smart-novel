version: "3"

vars:
  # `pnpm exec` finds no workspace package in apps/*, so the root binaries are called directly.
  BIN: "{{.ROOT_DIR}}/node_modules/.bin"

tasks:
  generate:limits:
    desc: The limits of the validation directives of the Go schema, as constants (needs Go, so it runs on the host)
    dir: "{{.ROOT_DIR}}"
    sources:
      - apps/backend/api/*.graphql
      - ../backend/tools/go.mod
      - ../backend/tools/gensdl/*.go
    generates:
      - apps/frontend/src/generated/limits.ts
    cmds:
      - cd apps/backend/tools && go run ./gensdl -schema ../api -out ../../frontend/src/generated/limits.ts

  generate:graphql-hooks:
    desc: Typed React Query hooks from the GraphQL schema of the Go backend (run `task backend:generate` first, it writes api/ent.graphql)
    sources:
      - codegen.ts
      - src/**/*.graphql
      - ../backend/api/*.graphql
    generates:
      - src/generated/graphql.ts
    cmds:
      - "{{.BIN}}/graphql-codegen --config codegen.ts"

  generate:
    desc: Everything generated for the frontend (GraphQL hooks and the limits)
    deps: [generate:limits, generate:graphql-hooks]

  serve:
    desc: Vite dev server
    cmds:
      - "{{.BIN}}/vite --host=0.0.0.0 {{.CLI_ARGS}}"

  build:
    desc: Production build into dist/apps/frontend
    deps: [generate, typecheck]
    cmds:
      - "{{.BIN}}/vite build"

  typecheck:
    deps: [generate]
    desc: "Type checks the frontend code, it is needed since just building the project will not catch `const probe: number = 'Hi';`"
    cmds:
      - "{{.BIN}}/tsc --noEmit -p tsconfig.app.json"

  test:
    deps: [generate]
    cmds:
      - "{{.BIN}}/vitest run --config vitest.config.ts {{.CLI_ARGS}}"

  lint:
    cmds:
      - task: typecheck
      - "{{.BIN}}/eslint . --fix"

  lint:check:
    cmds:
      - task: typecheck
      - "{{.BIN}}/eslint ."

  storybook:
    cmds:
      - "{{.BIN}}/storybook dev -p 6006 {{.CLI_ARGS}}"

  build:storybook:
    deps: [generate]
    cmds:
      - "{{.BIN}}/storybook build"

  test:e2e:
    desc: Start the e2e stack, run Cypress, tear the stack down
    dir: "{{.ROOT_DIR}}"
    cmds:
      - node apps/frontend-e2e/src/support/run-frontend-e2e.mjs apps/frontend-e2e

  open:e2e:
    desc: Cypress UI against a running `task dev:start`
    dir: "{{.ROOT_DIR}}"
    cmds:
      - "{{.BIN}}/cypress open --project apps/frontend-e2e"

  lint:e2e:
    dir: "{{.ROOT_DIR}}/apps/frontend-e2e"
    cmds:
      - "{{.BIN}}/eslint . --fix"

  lint:check:e2e:
    dir: "{{.ROOT_DIR}}/apps/frontend-e2e"
    cmds:
      - "{{.BIN}}/eslint ."
