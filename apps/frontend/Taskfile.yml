version: "3"

tasks:
  limits:
    desc: The limits of the validation directives of the Go schema, as constants (needs Go, so it runs on the host)
    dir: "{{.ROOT_DIR}}"
    sources:
      - apps/backend/api/*.graphql
      - tools/go.mod
      - tools/gensdl/*.go
    generates:
      - apps/frontend/src/generated/limits.ts
    cmds:
      - go run ./tools/gensdl -schema apps/backend/api -out apps/frontend/src/generated/limits.ts

  generate:
    desc: Typed React Query hooks from the GraphQL schema of the Go backend (run `task backend:generate` first, it writes api/ent.graphql), and the limits
    deps: [limits]
    sources:
      - codegen.ts
      - src/**/*.graphql
      - ../backend/api/*.graphql
    generates:
      - src/generated/graphql.ts
    cmds:
      - pnpm exec graphql-codegen --config codegen.ts

  codegen:
    desc: Alias of generate
    cmds:
      - task: generate

  serve:
    desc: Vite dev server
    cmds:
      - pnpm exec vite --host=0.0.0.0 {{.CLI_ARGS}}

  build:
    desc: Production build into dist/apps/frontend
    deps: [generate]
    cmds:
      - pnpm exec vite build

  typecheck:
    deps: [generate]
    cmds:
      - pnpm exec tsc --noEmit -p tsconfig.app.json

  test:
    deps: [generate]
    cmds:
      - pnpm exec vitest run --config vitest.config.ts {{.CLI_ARGS}}

  lint:
    cmds:
      - pnpm exec eslint . --fix

  lint:check:
    cmds:
      - pnpm exec eslint .

  storybook:
    cmds:
      - pnpm exec storybook dev -p 6006 {{.CLI_ARGS}}

  storybook:build:
    deps: [generate]
    cmds:
      - pnpm exec storybook build
