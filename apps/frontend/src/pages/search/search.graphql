query SearchNovels($filters: NovelFiltersInput) {
  novelsConnection(first: 50, filters: $filters) {
    edges {
      cursor
      node {
        id
        name
        author
        category
        state
        coverUrl
        description
        lastChapterPublishedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
  }
}

query GetCategories {
  categoriesConnection(first: 100) {
    edges {
      node {
        name
      }
    }
  }
}
