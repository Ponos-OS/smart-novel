query SearchNovels($filters: NovelFiltersInput) {
  novelsConnection(first: 50, filters: $filters) {
    edges {
      cursor
      node {
        id
        name
        author
        category
        state
        coverUrl
        description
        lastChapterPublishedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
  }
}

query FilterCategories($first: Int!, $after: String) {
  categoriesConnection(first: $first, after: $after) {
    edges {
      node {
        id
        name
        approximateNovelCount
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
