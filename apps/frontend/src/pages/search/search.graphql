query SearchNovels($filters: NovelFiltersInput) {
  novelsConnection(first: 50, filters: $filters) {
    edges {
      cursor
      node {
        id
        name
        author
        category
        state
        coverUrl
        description
        lastChapterPublishedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
  }
}

query FilterCategories(
  $search: String
  $first: Int!
  $after: String
) {
  categoriesConnection(
    first: $first
    after: $after
    filters: { search: $search }
  ) {
    edges {
      node {
        id
        name
        approximateNovelCount
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
