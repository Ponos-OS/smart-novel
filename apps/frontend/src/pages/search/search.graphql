query SearchNovels($filters: NovelFiltersInput) {
  novelsConnection(first: 50, filters: $filters) {
    edges {
      cursor
      node {
        id
        name
        writer {
          penName
        }
        tags
        state
        coverUrl
        description
        lastChapterPublishedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
  }
}

query FilterTags($search: String, $first: Int!, $after: String) {
  tagsConnection(
    first: $first
    after: $after
    filters: { search: $search }
  ) {
    edges {
      node {
        id
        name
        approximateNovelCount
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
