query SearchNovels(
  $where: NovelWhereInput
  $chapterCount: ChapterCountRangeInput
  $ownerIDs: [String!]
) {
  novels(
    first: 50
    where: $where
    chapterCount: $chapterCount
    ownerIDs: $ownerIDs
  ) {
    edges {
      cursor
      node {
        id
        name
        writer {
          penName
        }
        tags {
          name
        }
        state
        coverURL
        description
        lastChapterPublishedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
  }
}

query FilterTags($search: String, $first: Int!, $after: Cursor) {
  tags(
    first: $first
    after: $after
    where: { nameContainsFold: $search }
  ) {
    edges {
      node {
        id
        name
        approximateNovelCount
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
