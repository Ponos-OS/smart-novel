query GetNovel($id: ID!) {
  novel(id: $id) {
    id
    name
    writer {
      penName
    }
    tags {
      name
    }
    state
    coverURL
    description
    allowedActions
    license {
      id
      name
      sourceType
      canonicalID
      officialURL
      text
    }
    chapters(
      first: 100
      orderBy: { field: CHAPTER_NUMBER, direction: ASC }
    ) {
      edges {
        cursor
        node {
          id
          title
          chapterNumber
          createdAt
          narrationStatus
          narrationURL
        }
      }
      pageInfo {
        endCursor
        hasNextPage
        hasPreviousPage
        startCursor
      }
      totalCount
    }
    firstChapter {
      id
    }
    lastPublishedChapter {
      id
    }
  }
}

query GetChapter($novelId: ID!, $chapterId: ID!) {
  novel(id: $novelId) {
    chapter(id: $chapterId) {
      id
      novelID
      title
      content
      createdAt
      updatedAt
      contentUpdatedAt
      narrationStatus
      narrationURL
      next {
        id
      }
      previous {
        id
      }
    }
  }
}

mutation CreateChapter($novelId: ID!, $input: CreateChapterInput!) {
  createChapter(novelID: $novelId, input: $input) {
    id
  }
}

mutation UpdateContent(
  $id: ID!
  $content: String!
  $expectedContentUpdatedAt: Time!
) {
  updateContent(
    id: $id
    content: $content
    expectedContentUpdatedAt: $expectedContentUpdatedAt
  ) {
    id
    content
  }
}

mutation UpdateChapter(
  $id: ID!
  $input: UpdateChapterInput!
  $expectedUpdatedAt: Time!
) {
  updateChapter(
    id: $id
    input: $input
    expectedUpdatedAt: $expectedUpdatedAt
  ) {
    id
    title
  }
}

mutation UpdateChapterAndContent(
  $id: ID!
  $content: String!
  $expectedContentUpdatedAt: Time!
  $input: UpdateChapterInput!
  $expectedUpdatedAt: Time!
) {
  updateContent(
    id: $id
    content: $content
    expectedContentUpdatedAt: $expectedContentUpdatedAt
  ) {
    id
    content
  }
  updateChapter(
    id: $id
    input: $input
    expectedUpdatedAt: $expectedUpdatedAt
  ) {
    id
    title
  }
}

mutation DeleteChapter($id: ID!) {
  deleteChapter(id: $id) {
    id
    novelID
  }
}

mutation GenerateChapterAudio($id: ID!) {
  generateChapterAudio(id: $id) {
    status
    narrationURL
  }
}
