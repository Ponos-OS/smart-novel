query SearchCategories(
  $search: String
  $first: Int!
  $after: String
) {
  categoriesConnection(
    first: $first
    after: $after
    filters: { search: $search }
  ) {
    edges {
      node {
        id
        name
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation RequestCategory($name: String!) {
  requestCategory(name: $name) {
    id
    name
    status
  }
}
