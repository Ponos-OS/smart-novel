query GetNovels(
  $first: Int
  $after: String
  $filters: NovelFiltersInput
) {
  novelsConnection(first: $first, after: $after, filters: $filters) {
    edges {
      cursor
      node {
        id
        name
        writer {
          penName
        }
        category
        state
        coverUrl
        description
        lastChapterPublishedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
  }
}
