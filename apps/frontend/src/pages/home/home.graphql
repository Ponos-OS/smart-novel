query GetNovels(
  $first: Int
  $after: Cursor
  $where: NovelWhereInput
  $chapterCount: ChapterCountRangeInput
  $ownerIDs: [String!]
) {
  novels(
    first: $first
    after: $after
    where: $where
    chapterCount: $chapterCount
    ownerIDs: $ownerIDs
  ) {
    edges {
      cursor
      node {
        id
        name
        writer {
          penName
        }
        tags {
          name
        }
        state
        coverURL
        description
        lastChapterPublishedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
  }
}
