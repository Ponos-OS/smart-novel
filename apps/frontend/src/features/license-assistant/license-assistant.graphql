mutation DraftLicense($input: DraftLicenseInput!) {
  draftLicense(input: $input) {
    assistantMessage
    draft {
      name
      text
      sourceType
      canonicalID
    }
    draftChanged
    recommendations
    disclaimers
    isReadyToFinalize
    conversation {
      role
      content
    }
  }
}

query CanonicalLicenses {
  licenses(
    first: 100
    scope: SHARED
    where: { sourceType: CANONICAL }
  ) {
    edges {
      node {
        id
        name
        canonicalID
        version
        officialURL
      }
    }
  }
}

query CanonicalLicense($canonicalID: String!) {
  licenses(
    first: 1
    scope: SHARED
    where: { sourceType: CANONICAL, canonicalID: $canonicalID }
  ) {
    edges {
      node {
        id
        name
        canonicalID
        version
        officialURL
        text
      }
    }
  }
}
