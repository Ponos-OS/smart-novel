query Licenses($search: String, $first: Int!, $after: Cursor) {
  licenses(first: $first, after: $after, search: $search) {
    edges {
      node {
        id
        name
        scope
        isDefault
        sourceType
        canonicalID
        officialURL
        text
        updatedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
