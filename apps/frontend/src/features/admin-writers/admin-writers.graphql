query AdminWriters(
  $status: WriterStatus
  $first: Int!
  $after: String
) {
  writersConnection(
    first: $first
    after: $after
    filters: { status: $status }
  ) {
    edges {
      node {
        id
        penName
        name
        email
        status
        createdAt
        applications {
          note
          appliedAt
          rejectionReason
          reviewedAt
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation ApproveWriter($id: ID!) {
  approveWriter(id: $id) {
    id
    status
  }
}

mutation RejectWriter($id: ID!, $reason: String) {
  rejectWriter(id: $id, reason: $reason) {
    id
    status
    applications {
      rejectionReason
    }
  }
}
