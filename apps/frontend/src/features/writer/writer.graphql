query MyWriter {
  myWriter {
    id
    penName
    status
    createdAt
    applications {
      note
      appliedAt
      rejectionReason
      reviewedAt
    }
  }
}

mutation RequestWriterAccess($note: String!, $penName: String!) {
  requestWriterAccess(note: $note, penName: $penName) {
    id
    penName
    status
    createdAt
    applications {
      note
      appliedAt
      rejectionReason
      reviewedAt
    }
  }
}
