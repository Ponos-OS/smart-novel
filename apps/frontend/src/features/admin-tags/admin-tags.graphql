query AdminTags(
  $search: String
  $statuses: [TagStatus!]
  $first: Int!
  $after: Cursor
) {
  tags(
    first: $first
    after: $after
    where: { nameContainsFold: $search, statusIn: $statuses }
  ) {
    edges {
      node {
        id
        name
        description
        status
        requesterUserID
        approximateNovelCount
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation ApproveTag($id: ID!) {
  approveTag(id: $id) {
    id
    status
  }
}

mutation UpdateTag($id: ID!, $input: UpdateTagInput!) {
  updateTag(id: $id, input: $input) {
    id
    name
    description
  }
}

mutation DeleteTag($id: ID!) {
  deleteTag(id: $id) {
    id
  }
}

mutation CreateTag($input: CreateTagInput!) {
  createTag(input: $input) {
    id
    name
  }
}
