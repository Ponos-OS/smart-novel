query AdminLicenses(
  $scope: LicenseScope
  $search: String
  $first: Int!
  $after: String
) {
  licensesConnection(
    first: $first
    after: $after
    filters: { scope: $scope, search: $search }
  ) {
    edges {
      node {
        id
        name
        scope
        isDefault
        sourceType
        canonicalId
        ownerId
        updatedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation SetDefaultLicense($input: SetDefaultLicenseInput!) {
  setDefaultLicense(input: $input) {
    id
    name
    sourceType
    canonicalId
    officialUrl
    text
  }
}

mutation CreateLicense($input: LicenseDraftInput!) {
  createLicense(input: $input) {
    id
    name
  }
}
