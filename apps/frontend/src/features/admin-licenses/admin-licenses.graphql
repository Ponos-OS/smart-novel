query AdminLicenses(
  $scope: LicenseScope
  $search: String
  $first: Int!
  $after: Cursor
) {
  licenses(
    first: $first
    after: $after
    scope: $scope
    search: $search
  ) {
    edges {
      node {
        id
        name
        scope
        isDefault
        sourceType
        canonicalID
        ownerID
        updatedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation SetDefaultLicense($licenseID: ID!) {
  setDefaultLicense(licenseID: $licenseID) {
    id
    name
    sourceType
    canonicalID
    officialURL
    text
  }
}

mutation CreateLicense($input: LicenseInput!) {
  createLicense(input: $input) {
    id
    name
  }
}
