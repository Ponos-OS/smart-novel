query AdminNovels(
  $where: NovelWhereInput
  $chapterCount: ChapterCountRangeInput
  $ownerIDs: [String!]
  $orderBy: NovelOrder
  $first: Int!
  $after: Cursor
) {
  novels(
    first: $first
    after: $after
    where: $where
    chapterCount: $chapterCount
    ownerIDs: $ownerIDs
    orderBy: $orderBy
  ) {
    edges {
      node {
        id
        name
        state
        firstChapterCreatedAt
        estimatedChapterCount
        license {
          id
          name
        }
        writer {
          userID
          penName
          name
          email
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query SearchWriters($search: String, $first: Int!, $after: Cursor) {
  writers(
    first: $first
    after: $after
    where: { status: APPROVED }
    search: $search
  ) {
    edges {
      node {
        userID
        penName
        name
        email
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query ContentStats {
  contentStats {
    estimatedNovelCount
    estimatedChapterCount
  }
}

query StatsSnapshots($last: Int!) {
  statsSnapshots(last: $last) {
    edges {
      node {
        id
        day
        novelCount
        chapterCount
      }
    }
  }
}
