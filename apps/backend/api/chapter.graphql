type ChapterViewerState {
  """
  Whether the current user has read this chapter
  """
  isRead: Boolean!

  """
  When the chapter was first marked as read
  """
  readAt: Time
}

extend type Chapter {
  """
  The content of the chapter in markdown format
  """
  content: String! @goField(forceResolver: true)

  """
  When the chapter content was last updated. Pass this back as expectedContentUpdatedAt on updateContent to detect concurrent edits.
  """
  contentUpdatedAt: Time! @goField(forceResolver: true)

  """
  The next chapter
  """
  next: Chapter @goField(forceResolver: true)

  """
  The previous chapter
  """
  previous: Chapter @goField(forceResolver: true)

  """
  Viewer-specific state for this chapter
  """
  viewerState: ChapterViewerState! @goField(forceResolver: true)
}

type DeleteChapterResponse {
  """
  ID of the deleted chapter
  """
  id: ID!

  """
  ID of the novel the chapter belonged to
  """
  novelID: ID!
}

type MarkChaptersReadResponse {
  """
  Number of NEW chapters marked as read (excludes already-read chapters)
  """
  markedCount: Int!
}

type DeleteReadHistoryResponse {
  """
  Number of chapter read records deleted
  """
  deletedCount: Int!
}

input CreateChapterInput {
  """
  Chapter title
  """
  title: String! @isString

  """
  Chapter content in markdown format
  """
  content: String! @isString(multiline: true)
}

input UpdateChapterInput {
  """
  Chapter title
  """
  title: String @isString
}

extend type Mutation {
  """
  Create a new chapter for a novel. The chapter number is auto-assigned as the next number after the novel's current last chapter.
  """
  createChapter(novelID: ID!, input: CreateChapterInput!): Chapter!
    @hasRole(role: writer)

  """
  Update a chapter's content. There is no draft support here; use a VCS if you want to draft before saving. This is a no-op, if the content is byte-identical to what's already stored.
  """
  updateContent(
    id: ID!
    content: String! @isString(multiline: true)

    """
    The content version this edit was based on (from Chapter.contentUpdatedAt). The mutation is rejected with CONFLICT if the chapter's content has changed since.
    """
    expectedContentUpdatedAt: Time!
  ): Chapter! @hasRole(role: writer)

  """
  Update a chapter's metadata, e.g. its title.
  """
  updateChapter(
    id: ID!
    input: UpdateChapterInput!

    """
    The chapter version this edit was based on (from Chapter.updatedAt). The mutation is rejected with CONFLICT if the chapter has changed since.
    """
    expectedUpdatedAt: Time!
  ): Chapter! @hasRole(role: writer)

  """
  Permanently delete a chapter, its content and its read history. The later chapters of the novel are renumbered down by one.
  """
  deleteChapter(id: ID!): DeleteChapterResponse!
    @hasRole(role: writer)

  """
  Mark one or more chapters as read for the authenticated user. Maximum 100 chapter IDs per request.
  """
  markChaptersRead(
    chapterIDs: [ID!]! @maxSize(max: 100)
  ): MarkChaptersReadResponse! @skipTermsOfServiceCheck

  """
  Delete all read history for the authenticated user (GDPR compliance).
  """
  deleteReadHistory: DeleteReadHistoryResponse!
    @skipTermsOfServiceCheck
}

type ChapterNarrationResponse {
  status: NarrationStatus!
  narrationURL: String
}

extend type Mutation {
  """
  Start making the audio narration of a chapter: new audio every time, also when the chapter has some already. Answers at once with PROCESSING; the audio address appears on the chapter (`narrationURL`) when the job is done. Refused when a narration of the chapter is running (`CONFLICT`) or the chapter has no text (`BAD_REQUEST`); `SERVICE_UNAVAILABLE` when Beatrice cannot be reached.
  """
  generateChapterAudio(
    """
    The ID of the chapter
    """
    id: ID!
  ): ChapterNarrationResponse! @hasRole(role: writer)
}
