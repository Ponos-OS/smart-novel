extend type Tag {
  """
  An estimate of how many novels have this tag, taken from the database planner rather than counted. It can be off, most for small tags, and is never exact.
  """
  approximateNovelCount: Int! @goField(forceResolver: true)

  """
  Admin only: the identity provider's user ID of the writer who requested the tag. Null for everybody else, and for tags nobody requested.
  """
  requesterUserID: String @goField(forceResolver: true)
}

input RequestTagInput {
  """
  Trimmed, and unique regardless of case. At most 50 characters.
  """
  name: String! @isString @maxLength(max: 50)

  """
  What the tag is for, trimmed. At most 650 characters.
  """
  description: String! @isString(multiline: true) @maxLength(max: 650)
}

input CreateTagInput {
  """
  Trimmed, and unique regardless of case. At most 50 characters.
  """
  name: String! @isString @maxLength(max: 50)

  """
  What the tag is for, trimmed. At most 650 characters.
  """
  description: String! @isString(multiline: true) @maxLength(max: 650)
}

input UpdateTagInput {
  """
  Trimmed, and unique regardless of case. At most 50 characters.
  """
  name: String @isString @maxLength(max: 50)

  """
  What the tag is for, trimmed. At most 650 characters.
  """
  description: String @isString(multiline: true) @maxLength(max: 650)
}

type DeleteTagResponse {
  """
  ID of the deleted tag
  """
  id: ID!
}

extend type Mutation {
  """
  Ask for a tag that does not exist yet, with a required short description of what it is for. It is PENDING, and cannot be put on novels, until an admin approves it; the admin may change the name and the description first. A name that already exists, even in another case, is a BAD_REQUEST that names the existing tag.
  """
  requestTag(input: RequestTagInput!): Tag! @hasRole(role: writer)

  """
  Admin only. Create a tag that is APPROVED right away, so writers can put it on novels. A name that already exists, even in another case, is a BAD_REQUEST that names the existing tag.
  """
  createTag(input: CreateTagInput!): Tag! @hasRole(role: admin)

  """
  Admin only. Approve a pending tag; approving an approved one changes nothing.
  """
  approveTag(id: ID!): Tag! @hasRole(role: admin)

  """
  Admin only. Change the name, the description or both of a tag of any status; the novels that have it follow a rename. At least one is required. A name that already exists is a BAD_REQUEST.
  """
  updateTag(id: ID!, input: UpdateTagInput!): Tag!
    @hasRole(role: admin)

  """
  Admin only. Delete a tag of any status, which also rejects a pending request. It is removed from every novel that has it; the novels stay.
  """
  deleteTag(id: ID!): DeleteTagResponse! @hasRole(role: admin)
}
