"""
SHARED belongs to the platform and any writer may use it, PERSONAL was finalized by a writer and only that writer may use it (everybody can read it), DRAFT is still being worked on and is private to its writer
"""
enum LicenseScope {
  SHARED
  PERSONAL
  DRAFT
}

extend type License {
  """
  SHARED, PERSONAL or DRAFT. A draft is a license being worked on: private to its writer, mutable, and not usable on a novel until it is finalized. Its name and text may be empty.
  """
  scope: LicenseScope! @goField(forceResolver: true)
}

"""
A license text the author picked or wrote. Stored once per distinct text.
"""
input LicenseInput {
  """
  E.g. "CC BY 4.0"
  """
  name: String! @isString @maxLength(max: 200)

  """
  The full license text
  """
  text: String! @isString(multiline: true) @maxLength(max: 100000)
  sourceType: LicenseSourceType!

  """
  Required for CANONICAL and FORKED, must be omitted for CUSTOM
  """
  canonicalID: String @isString
}

input CreateLicenseDraftInput {
  """
  Start from the text of this license. Exclusive with `canonicalID`. Omit both to start from nothing.
  """
  licenseID: ID

  """
  Start from the text of this canonical license of the registry, e.g. "CC-BY-NC-4.0".
  """
  canonicalID: String @isString
}

"""
The whole draft, as the writer has it. A draft may be empty or inconsistent while it is being written; finalizing checks it.
"""
input SaveLicenseDraftInput {
  id: ID!
  name: String! @isString(allowEmpty: true) @maxLength(max: 200)
  text: String!
    @isString(multiline: true, allowEmpty: true)
    @maxLength(max: 100000)
  sourceType: LicenseSourceType!
  canonicalID: String @isString
}

enum LicenseAssistantMessageRole {
  ASSISTANT
  USER
}

"""
One turn of the conversation with the license assistant.
"""
type LicenseAssistantMessage {
  role: LicenseAssistantMessageRole!
  content: String!
}

"""
The license text being worked on.
"""
type LicenseAssistantDraft {
  name: String!

  """
  The draft text, as Markdown
  """
  text: String!
  sourceType: LicenseSourceType!

  """
  The canonical license the draft is, or was modified from. Null for CUSTOM.
  """
  canonicalID: String
}

"""
The assistant answer to one message.
"""
type LicenseAssistantTurn {
  assistantMessage: String!
  draft: LicenseAssistantDraft

  """
  False when the assistant only explained something; the draft must not be flashed then
  """
  draftChanged: Boolean!

  """
  Canonical license IDs the assistant suggests
  """
  recommendations: [String!]!

  """
  Always non-empty and always to be shown
  """
  disclaimers: [String!]!

  """
  The assistant's opinion on readiness. The client decides whether to act on it.
  """
  isReadyToFinalize: Boolean!

  """
  The conversation to send as `conversation` on the next request, exactly as returned. A long history is condensed in it, so keep your own transcript to show every message.
  """
  conversation: [LicenseAssistantMessage!]!
}

input LicenseAssistantMessageInput {
  role: LicenseAssistantMessageRole!
  content: String! @isString(multiline: true) @maxLength(max: 4000)
}

"""
The draft the author is working on, as the client holds it.
"""
input LicenseAssistantDraftInput {
  name: String! @isString(allowEmpty: true) @maxLength(max: 200)
  text: String!
    @isString(multiline: true, allowEmpty: true)
    @maxLength(max: 100000)
  sourceType: LicenseSourceType!
  canonicalID: String @isString
}

input LicenseAssistantPreferencesInput {
  """
  A canonical license category to prefer
  """
  category: String @isString
}

input DraftLicenseInput {
  """
  The `conversation` of the previous answer, unchanged. Empty to start a new conversation. Nothing is stored here: the client keeps the conversation.
  """
  conversation: [LicenseAssistantMessageInput!]! = []
    @maxSize(max: 50)

  """
  The draft the author is working on, as the client holds it. It may have been edited since the previous answer.
  """
  draft: LicenseAssistantDraftInput
  message: String! @isString(multiline: true) @maxLength(max: 2000)
  preferences: LicenseAssistantPreferencesInput
}

extend type Query {
  """
  The license new novels get when none is chosen
  """
  defaultLicense: License!

  """
  Paginated licenses, newest save first unless `orderBy` says otherwise, narrowed by `scope` and `search` (the name contains it, whatever the case). Anybody, signed in or not, gets every finished license; a writer also gets their own drafts, never another writer's; an admin gets every license and draft. A writer can put on a novel only a shared license or their own, whatever they can read. Canonical licenses carry the registry's `version` and `officialURL`. Without `first` or `last` a page of 20 is returned, at most 100 are allowed.
  """
  licenses(
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: LicenseOrder
    where: LicenseWhereInput

    """
    Omit to get every scope the caller may see
    """
    scope: LicenseScope
    search: String @isString(allowEmpty: true) @maxLength(max: 100)
  ): LicenseConnection! @public

  """
  A license draft of the caller; an admin can read anybody's. Another writer's is not found.
  """
  licenseDraft(id: ID!): License! @hasRole(role: writer)
}

extend type Mutation {
  """
  Send one message to the license assistant. Nothing is stored: send the conversation of the previous answer back with the next message. Answers `LICENSE_ASSISTANT_RATE_LIMITED` when Fithara limits the writer, `LICENSE_ASSISTANT_INVALID_REQUEST`, `CANONICAL_LICENSE_NOT_FOUND`, `CANONICAL_LICENSE_RETIRED` or `SERVICE_UNAVAILABLE`.
  """
  draftLicense(input: DraftLicenseInput!): LicenseAssistantTurn!
    @hasRole(role: writer)

  """
  Admin only. Store a license every writer can use. An already stored text is returned as it is. The default license does not change.
  """
  createLicense(input: LicenseInput!): License! @hasRole(role: admin)

  """
  Admin only. Change the license new novels get to a shared one (see `createLicense`); existing novels keep theirs.
  """
  setDefaultLicense(licenseID: ID!): License! @hasRole(role: admin)

  """
  Start a license draft, from the text of a license, of a canonical license, or from nothing. At most 20 unfinished drafts per writer. Returns it with its ID; save it by that ID.
  """
  createLicenseDraft(input: CreateLicenseDraftInput!): License!
    @hasRole(role: writer)

  """
  Save the whole draft. Saving what is already saved writes nothing. The last save wins.
  """
  saveLicenseDraft(input: SaveLicenseDraftInput!): License!
    @hasRole(role: writer)

  """
  Say the draft is finished: it becomes a license, or is replaced by the stored license with the same text. Use the returned license, its ID can differ from the draft's. The draft is gone afterwards.
  """
  finalizeLicenseDraft(id: ID!): License! @hasRole(role: writer)

  """
  Throw a draft away
  """
  discardLicenseDraft(id: ID!): Boolean! @hasRole(role: writer)
}
