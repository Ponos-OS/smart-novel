extend type Writer {
  """
  Every application of the writer, oldest first; the last one is the current one
  """
  applications: [WriterApplication!]! @goField(forceResolver: true)
}

extend type Query {
  """
  The caller's writer record (their latest request), or null
  """
  myWriter: Writer @hasRole(role: user)

  """
  Admin only. Writer requests, oldest first, PENDING unless `where` names a status, narrowed by `search` (the pen name contains it, whatever the case). Without `first` or `last` a page of 20 is returned, at most 100 are allowed.
  """
  writers(
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: WriterOrder
    where: WriterWhereInput
    search: String @isString(allowEmpty: true) @maxLength(max: 100)
  ): WriterConnection! @hasRole(role: admin)
}

extend type Mutation {
  """
  Ask to become a writer, with the pen name the writer will be known by. A BAD_REQUEST when the caller is already a writer or admin, already has a pending request, or sends an empty or too long note. A pen name that breaks the rule (English letters, hyphens and underscores, 3 to 50) is a BAD_REQUEST with a message to show. PEN_NAME_TAKEN when another writer has the pen name, in any case. A rejected user may ask again and keeps a history of their applications.
  """
  requestWriterAccess(
    note: String! @isString(multiline: true) @maxLength(max: 1000)
    penName: String!
      @isString(message: "Choose a pen name")
      @pattern(
        regex: "^[A-Za-z_-]+$"
        message: "A pen name can only have English letters, hyphens and underscores"
      )
      @minLength(
        min: 3
        message: "A pen name needs at least 3 characters"
      )
      @maxLength(
        max: 50
        message: "A pen name can have at most 50 characters"
      )
  ): Writer! @hasRole(role: user) @skipTermsOfServiceCheck

  """
  Admin only. Grant the writer role to the requester in ZITADEL, then mark the request APPROVED. A BAD_REQUEST when it was already reviewed, NOT_FOUND when it does not exist. When ZITADEL fails the request stays PENDING and the mutation fails, so it can be retried. The user gets the role in their token after signing in again.
  """
  approveWriter(id: ID!): Writer! @hasRole(role: admin)

  """
  Admin only. Mark a pending request REJECTED, with a reason the requester sees. A BAD_REQUEST when it was already reviewed, NOT_FOUND when it does not exist. The user may file a new request afterwards.
  """
  rejectWriter(
    id: ID!
    reason: String
      @isString(multiline: true, allowEmpty: true)
      @maxLength(max: 1000)
  ): Writer! @hasRole(role: admin)
}
