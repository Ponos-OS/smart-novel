version: "3"

tasks:
  generate:
    desc: Everything generated for the Go backend
    deps: [":generate:shared"]

  test:
    deps: [generate]
    cmds:
      - go test -count=1 ./... {{.CLI_ARGS}}

  lint:
    deps: [generate]
    cmds:
      - go vet ./...

  lint:check:
    deps: [generate]
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)"

  format:
    cmds:
      - gofmt -w .
