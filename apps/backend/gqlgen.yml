schema:
  - api/*.graphql

exec:
  filename: internal/graph/generated.go
  package: graph

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph

autobind:
  - github.com/Ponos-OS/smart-novel/apps/backend/ent

models:
  ID:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/graph/scalar.UUID
  Cursor:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/graph/scalar.Cursor
  Node:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/ent.Noder
  RequestTagInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/tag.Input
  CreateTagInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/tag.Input
  UpdateTagInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/tag.Update
  LicenseInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.Input
  CreateLicenseDraftInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.DraftStart
  SaveLicenseDraftInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.DraftSave
  LicenseAssistantMessageRole:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.AssistantRole
  LicenseAssistantMessage:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.AssistantMessage
  LicenseAssistantMessageInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.AssistantMessage
  LicenseAssistantDraft:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.AssistantDraft
  LicenseAssistantDraftInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.AssistantDraft
  LicenseAssistantPreferencesInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.AssistantPreferences
  LicenseAssistantTurn:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.AssistantTurn
  DraftLicenseInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.AssistantRequest
  LicenseScope:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/license.Scope
  WordExplanation:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/llm.Explanation
  NovelCoverUpload:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/novel.CoverUpload
  CreateNovelInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/novel.CreateInput
  UpdateNovelInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/novel.UpdateInput
  ChapterCountRangeInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/novel.ChapterCountRange
  NovelWriter:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/novel.WriterView
  PlatformTerms:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/platformterms.Terms
  PlatformTermsStatus:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/platformterms.Status
  WriterApplication:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/writer.Application
  CreateChapterInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/chapter.CreateInput
  UpdateChapterInput:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/chapter.UpdateInput
  ContentStats:
    model:
      - github.com/Ponos-OS/smart-novel/apps/backend/internal/stats.Totals
