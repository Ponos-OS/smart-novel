include:
  - compose.yml

services:
  backend-e2e:
    extends:
      file: compose.yml
      service: backend
    profiles:
      - backend-e2e
      - frontend-e2e
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
      args:
        PORT: $BACKEND_PORT
        DATABASE_URL: ${DATABASE_URL}
    environment:
      OLLAMA_RETRY_COUNT: 1
      # Beatrice must call back into this container (not `backend`) under the e2e profile.
      BACKEND_INTERNAL_URL: http://backend-e2e:${BACKEND_PORT}
    volumes:
      - zitadel-pat:/zitadel-pat:ro

  frontend-e2e:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
      args:
        VITE_SERVICE_URL: ${VITE_SERVICE_URL}
        # Use a placeholder for the client ID — it is generated at runtime by
        # setup-zitadel. The entrypoint below replaces the placeholder in
        # the built JS bundle before nginx starts.
        VITE_OIDC_CLIENT_ID: __OIDC_CLIENT_ID_PLACEHOLDER__
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE}
        ZITADEL_CLIENT_ID_FILE: ${ZITADEL_CLIENT_ID_FILE}
        VITE_OTLP_ENDPOINT: ${VITE_OTLP_ENDPOINT}
    profiles:
      - frontend-e2e
    depends_on:
      init-codegen:
        condition: service_completed_successfully
      backend-e2e:
        condition: service_healthy
      s3:
        condition: service_healthy
      setup-zitadel:
        condition: service_completed_successfully
    volumes:
      - ./local-setup/start-frontend-e2e.sh:/app/start-frontend-e2e.sh:ro
      - zitadel-pat:/zitadel-pat:ro
    command: ["/bin/sh", "/app/start-frontend-e2e.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.frontend-e2e.loadbalancer.server.port=80
      - traefik.http.routers.frontend-e2e-web.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend-e2e-web.entrypoints=web
      - traefik.http.routers.frontend-e2e-web.service=frontend-e2e
      - traefik.http.routers.frontend-e2e-web.priority=50
      # Serve frontend static assets from the frontend, but keep Zitadel's
      # /assets/v1 API path routed to Zitadel.
      - traefik.http.routers.frontend-e2e-assets.rule=PathPrefix(`/assets`) && !PathPrefix(`/assets/v1`)
      - traefik.http.routers.frontend-e2e-assets.entrypoints=web
      - traefik.http.routers.frontend-e2e-assets.service=frontend-e2e
      - traefik.http.routers.frontend-e2e-assets.priority=200
