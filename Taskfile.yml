version: "3"

dotenv: [".env"]

includes:
  backend:
    taskfile: apps/backend
    dir: apps/backend
    optional: true
  backend-e2e:
    taskfile: apps/backend-e2e
    dir: apps/backend-e2e
  frontend:
    taskfile: apps/frontend
    dir: apps/frontend
    optional: true
  frontend-e2e:
    taskfile: apps/frontend-e2e
    dir: apps/frontend-e2e
  shared:
    taskfile: libs/shared
    dir: libs/shared
    optional: true

tasks:
  generate:
    desc: Regenerate everything that is git-ignored
    deps: [backend:generate, frontend:generate]

  lint:
    desc: Lint and fix every project, then look for copy-pasted code
    cmds:
      - task: backend:lint
      - task: backend-e2e:lint
      - task: frontend:lint
      - task: frontend-e2e:lint
      - task: shared:lint
      - npx jscpd

  lint:check:
    desc: Lint every project without fixing
    cmds:
      - task: backend:lint:check
      - task: backend-e2e:lint:check
      - task: frontend:lint:check
      - task: frontend-e2e:lint:check
      - task: shared:lint:check
      - npx jscpd

  test:
    desc: Unit tests of every project
    cmds:
      - task: backend:test
      - task: frontend:test
      - task: shared:test

  format:
    desc: Format the repository
    cmds:
      - npx prettier . -w -u
      - task: backend:prisma:format

  clean:
    desc: Remove every generated or local-only file
    cmds:
      - >-
        rm -rf apps/frontend-e2e/cypress apps/frontend/src/generated
        apps/frontend/storybook-static apps/backend/schema.gql
        apps/backend/src/shared/beatrice/graphql-env.d.ts
        apps/backend/src/shared/beatrice/schema.graphql
        apps/backend/src/shared/fithara/openapi.json
        apps/backend/src/shared/fithara/schema.d.ts
        dist coverage Diffs.txt local-setup/client local-setup/logs
        local-setup/pats local-setup/user-ids
