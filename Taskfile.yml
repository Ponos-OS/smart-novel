version: "3"

dotenv: [".env"]

includes:
  backend:
    taskfile: apps/backend
    dir: apps/backend
    optional: true
  frontend:
    taskfile: apps/frontend
    dir: apps/frontend
    optional: true
  infra:
    taskfile: infra
    dir: .
    optional: true

tasks:
  generate:
    desc: Regenerate everything that is git-ignored
    deps: [backend:generate, frontend:generate]

  lint:
    desc: Lint and fix every project, then look for copy-pasted code
    cmds:
      - task: backend:lint
      - task: backend:lint:e2e
      - task: frontend:lint
      - task: frontend:lint:e2e
      - pnpm exec jscpd

  lint:check:
    desc: Lint every project without fixing
    cmds:
      - task: backend:lint:check
      - task: backend:lint:check:e2e
      - task: frontend:lint:check
      - task: frontend:lint:check:e2e
      - pnpm exec jscpd

  test:
    desc: Unit tests of every project
    cmds:
      - task: backend:test
      - task: frontend:test

  format:
    desc: Format the repository
    cmds:
      - pnpm exec prettier . -w -u
      - task: backend:format

  clean:
    desc: Remove every generated or local-only file
    cmds:
      - >-
        rm -rf apps/frontend-e2e/cypress apps/frontend/src/generated
        apps/frontend/storybook-static
        dist coverage Diffs.txt local-setup/client local-setup/logs
        local-setup/pats local-setup/user-ids .task
      - git clean -fdXq apps/backend

  format:check:
    desc: Check the formatting of the repository
    cmds:
      - pnpm exec prettier . --check -u

  init:
    desc: Install the dependencies and seed .env from .env.example
    cmds:
      - pnpm install --frozen-lockfile
      - cmd: cp --update=none .env.example .env
        ignore_error: true

  dev:start:
    desc: Build the images, create the kind cluster and apply the three Terraform stages
    cmds:
      - sh infra/scripts/start-dev.sh

  dev:stop:
    desc: Destroy the cluster and forget the state of the ZITADEL configuration
    cmds:
      - sh infra/scripts/stop-dev.sh

  dev:stop:force:
    desc: Stop the local stack when dev:stop cannot
    cmds:
      - sh infra/scripts/force-stop-dev.sh

  docs:structure:
    desc: Regenerate the project structure in .github/README.md
    cmds:
      - python3 scripts/update_project_structure.py
