pre-commit:
  jobs:
    - name: eslint
      glob: "*.{ts,tsx,js,jsx,mjs,graphql}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: "*.{ts,tsx,js,jsx,mjs,json,md,yml,yaml,graphql}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: lint
      run: task lint:check
    - name: test
      run: task test
