name: Release

on:
  workflow_run:
    workflows: [Build, E2E]
    types: [completed]
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    name: Tag the next version and bump package.json
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Next version
        id: version
        uses: ./.github/actions/next-version
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: npx semantic-release

      - name: The release is the version the dry run announced
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
