# Caveats:
# 1. GitHub-hosted runners are slow for this (Postgres + Zitadel + RustFS + LLM gateway + backend + frontend) stack on a 2-vCPU/7GB runner. We might need to switch to a self-hosted runners.
# 2. LLM gateway: in the CI pipeline we need to download the model on every run unless we cache it.
# 3. I am still NOT sure how can I have a Trunk-based Development flow whilst having this, I mean developer has already pushed their changes, the best it is doing it preventing it from being deployed probably! But other devs will be blocked if they start branching off of main and developing a new feature.

# Called by build.yml once its images job has built the images and uploaded them as an artifact. It does not build anything: it downloads the images, loads them and runs the suites against them.
#
# It stays a file of its own, with its own jobs, so a red e2e job (an environment that flaked: containers, network, timing) is told apart from a red build, lint or unit-test job in the checks list. build.yml runs it next to those jobs, not after them.

name: E2E

on:
  workflow_call:
    inputs:
      version:
        description: "The version the images in the smart-novel-images artifact are tagged with"
        type: string
        required: true

jobs:
  backend-e2e:
    name: backend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: smart-novel-images

      - name: Load images
        run: zstd -d -c smart-novel-images.tar.zst | docker load

      - name: Run backend e2e tests
        env:
          SKIP_IMAGE_BUILD: "1"
          IMAGE_TAG: ${{ inputs.version }}
        run: npx nx e2e backend-e2e

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-logs
          path: local-setup/logs
          if-no-files-found: ignore
          retention-days: 7

  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: smart-novel-images

      - name: Load images
        run: zstd -d -c smart-novel-images.tar.zst | docker load

      - name: Run frontend e2e tests (Cypress)
        env:
          SKIP_IMAGE_BUILD: "1"
          IMAGE_TAG: ${{ inputs.version }}
        run: npx nx e2e frontend-e2e

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: apps/frontend-e2e/cypress/videos
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/frontend-e2e/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-logs
          path: apps/frontend-e2e/cypress/logs
          if-no-files-found: ignore
          retention-days: 7
