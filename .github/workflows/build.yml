name: Build

on:
  pull_request:
    paths:
      - "apps/**"
      - "libs/**"
      - "infra/**"
      - "local-setup/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - "tsconfig.base.json"
      - ".env.example"
      - "sonar-project.properties"
      - ".github/workflows/build.yml"
      - ".github/workflows/e2e.yml"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "libs/**"
      - "infra/**"
      - "local-setup/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - "tsconfig.base.json"
      - ".env.example"
      - "sonar-project.properties"
      - ".github/workflows/build.yml"
      - ".github/workflows/e2e.yml"
      - ".github/actions/**"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two e2e jobs run on different VMs, so the images are built once here (the e2e jobs only load them), tagged with the version the release will give them, and handed over as an artifact. The layer cache lives in the GitHub Actions cache, because a runner starts empty every time.
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Next version
        id: version
        uses: ./.github/actions/next-version

      - name: Expose the GitHub Actions cache to Buildx (build-images.sh creates the builder)
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Build images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          DOCKER_BUILD_CACHE_SCOPE: e2e
        run: sh infra/scripts/build-images.sh e2e

      - name: Export images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: docker save smart-novel-backend:dev "smart-novel-backend:$IMAGE_TAG" "smart-novel-frontend:$IMAGE_TAG" | zstd -T0 -3 -o smart-novel-images.tar.zst

      - name: List the images
        run: |
          {
            echo "### Images tested from ${GITHUB_SHA}"
            echo
            docker image ls --format '| {{.Repository}}:{{.Tag}} | {{.ID}} |' | grep "smart-novel-"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the version of the images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: echo "$IMAGE_TAG" > smart-novel-images.version

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: smart-novel-images
          path: |
            smart-novel-images.tar.zst
            smart-novel-images.version
          compression-level: 0
          retention-days: 1

  e2e:
    name: e2e
    needs: images
    uses: ./.github/workflows/e2e.yml
    with:
      version: ${{ needs.images.outputs.version }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Build
        run: npx nx run-many -t build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Project structure has not drifted away
        run: |
          npm run docs:structure
          git diff --exit-code .github/README.md

  test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Run unit tests
        run: npx nx run-many -t test --coverage.enabled

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  sonarcloud:
    name: SonarQube Cloud
    needs: [build, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
