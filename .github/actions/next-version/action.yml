name: Next version
description: The version semantic-release will give the next release, or the current one when no release is due. The job must have checked out the full history and run npm ci.

inputs:
  github-token:
    description: Token semantic-release reads the repository with
    required: true

outputs:
  version:
    description: The next release version
    value: ${{ steps.next.outputs.version }}

runs:
  using: composite
  steps:
    - name: Work out the next version
      id: next
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HUSKY: 0
      run: |
        log="$(npx semantic-release --dry-run --no-ci 2>&1)" || { echo "$log"; exit 1; }
        version="$(printf '%s\n' "$log" | sed -n 's/.*[Tt]he next release version is \([0-9][^ ]*\).*/\1/p' | tail -n 1)"
        echo "${version:=$(node -p "require('./package.json').version")}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Next version: $version" >> "$GITHUB_STEP_SUMMARY"
