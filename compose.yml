services:
  # 👇 You'd do something similar to this in CI/CD pipeline to apply your migrations.
  init-postgres:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    env_file:
      - .env
    command:
      [
        "/bin/sh",
        "-lc",
        "npx nx run backend:prisma:db:push && npx nx prisma:generate backend && npx nx run backend:prisma:seed",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      setup-zitadel:
        condition: service_completed_successfully
    volumes:
      - ./apps:/app/apps
      - ./apps/backend/data:/data
      - /app/node_modules
      - zitadel-pat:/zitadel-pat:ro

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
      args:
        PORT: $BACKEND_PORT
    profiles:
      - dev
    env_file:
      - .env
    volumes:
      - ./apps:/app/apps
      - ./apps/backend/data:/data
      - /app/node_modules
      - zitadel-pat:/zitadel-pat:ro
    depends_on:
      init-postgres:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      beatrice:
        condition: service_healthy
      s3:
        condition: service_healthy
      init-s3:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tts:
        condition: service_healthy
      traefik:
        condition: service_healthy
      setup-zitadel:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      otel-healthcheck:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "-H",
          "Content-Type: application/json",
          "--data",
          '{"query":"{ health }"}',
          "http://localhost:$BACKEND_PORT/graphql",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.backend.loadbalancer.server.port=$BACKEND_PORT
      - traefik.http.routers.backend-web.rule=PathPrefix(`/graphql`)
      - traefik.http.routers.backend-web.entrypoints=web
      - traefik.http.routers.backend-web.service=backend
      - traefik.http.routers.backend-web.priority=300
      - traefik.http.routers.backend-beatrice-callbacks.rule=PathPrefix(`/beatrice-callbacks`)
      - traefik.http.routers.backend-beatrice-callbacks.entrypoints=web
      - traefik.http.routers.backend-beatrice-callbacks.service=backend
      - traefik.http.routers.backend-beatrice-callbacks.priority=300

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
      args:
        FRONTEND_PORT: $FRONTEND_PORT
        VITE_SERVICE_URL: $VITE_SERVICE_URL
        VITE_OTLP_ENDPOINT: $VITE_OTLP_ENDPOINT
        VITE_SERVICE_NAME: $VITE_SERVICE_NAME
        VITE_SERVICE_VERSION: $VITE_SERVICE_VERSION
    environment:
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE}
      VITE_SERVICE_URL: ${VITE_SERVICE_URL}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI}
      VITE_OTLP_ENDPOINT: ${VITE_OTLP_ENDPOINT}
      VITE_SERVICE_NAME: ${VITE_SERVICE_NAME}
      VITE_SERVICE_VERSION: ${VITE_SERVICE_VERSION}
      VITE_EXPLAIN_CONTEXT_CHAR_SIZE: ${EXPLAIN_CONTEXT_CHAR_SIZE}
      VITE_EXPLAIN_RATE_CAPACITY: 12
      VITE_EXPLAIN_CACHE_MAX_ENTRIES: 12
      VITE_EXPLAIN_RATE_REFILL_PER_SEC: 1.5
      VITE_EXPLAIN_SELECTION_DEBOUNCE_MS: 500
      ZITADEL_CLIENT_ID_FILE: ${ZITADEL_CLIENT_ID_FILE}
    command: ["/bin/sh", "/app/start-frontend-dev.sh"]
    profiles:
      - dev
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/node_modules
      - zitadel-pat:/zitadel-pat:ro
      - ./local-setup/start-frontend-dev.sh:/app/start-frontend-dev.sh:ro
    depends_on:
      init-codegen:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:$FRONTEND_PORT"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.frontend.loadbalancer.server.port=$FRONTEND_PORT
      - traefik.http.routers.frontend-web.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend-web.entrypoints=web
      - traefik.http.routers.frontend-web.service=frontend
      - traefik.http.routers.frontend-web.priority=50
      # Serve frontend static assets from the frontend, but keep Zitadel's
      # /assets/v1 API path routed to Zitadel.
      - traefik.http.routers.frontend-assets.rule=PathPrefix(`/assets`) && !PathPrefix(`/assets/v1`)
      - traefik.http.routers.frontend-assets.entrypoints=web
      - traefik.http.routers.frontend-assets.service=frontend
      - traefik.http.routers.frontend-assets.priority=200

  postgres:
    image: postgres:18.2-bookworm
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  create-zitadel-database:
    image: postgres:18.2-bookworm
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./local-setup/create-zitadel-db.sh:/app/create-zitadel-db.sh:ro
    entrypoint: ["/bin/sh", "/app/create-zitadel-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Traefik reverse proxy — single entry point (localhost:8080) for the
  # frontend, backend GraphQL API, Zitadel OIDC endpoints, and the Login UI.
  traefik:
    image: traefik:v3.6.8
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --api.insecure=false
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${TRAEFIK_EXPOSED_PORT}:80"
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.12.3
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel-pat/login-client.pat
      CUSTOM_REQUEST_HEADERS: "Host:localhost,X-Forwarded-Proto:http"
    volumes:
      - zitadel-pat:/zitadel-pat:ro
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -c
        - node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000
      - traefik.http.routers.zitadel-login-web.rule=PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login-web.entrypoints=web
      - traefik.http.routers.zitadel-login-web.service=zitadel-login
      - traefik.http.routers.zitadel-login-web.priority=250

  zitadel-init:
    image: ghcr.io/zitadel/zitadel:v4.12.3
    command: "init"
    depends_on:
      create-zitadel-database:
        condition: service_completed_successfully
      init-zitadel-pat-vol:
        condition: service_completed_successfully
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Admin123!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      # Machine user (IAM_OWNER) whose PAT is written to a shared volume so the setup-zitadel container can read it.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bot
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Bot
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "9999-12-31T23:59:59Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-pat/token
      ZITADEL_DEFAULTINSTANCE_INSTANCENAME: ZITADEL
      # Login V2 (separate Next.js app served by the zitadel-login container)
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:${TRAEFIK_EXPOSED_PORT}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:${TRAEFIK_EXPOSED_PORT}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:${TRAEFIK_EXPOSED_PORT}/ui/v2/login/logout?post_logout_redirect=
      # Machine user for the login service (PAT written to shared volume)
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-pat/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "9999-12-31T23:59:59Z"
      # Enable token exchange (RFC 8693) so e2e tests can impersonate human users via the bot's PAT.
      ZITADEL_DEFAULTINSTANCE_FEATURES_TOKENEXCHANGE_ENABLED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_IMPERSONATION_ENABLED: true
    networks:
      - default
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    volumes:
      - zitadel-pat:/zitadel-pat

  zitadel:
    extends:
      service: zitadel-init
    command: "start-from-setup --masterkeyFromEnv --tlsMode disabled"
    environment:
      ZITADEL_EXTERNALPORT: ${TRAEFIK_EXPOSED_PORT}
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_TLS_ENABLED: false
    networks:
      - proxy
      - default
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
      init-zitadel-pat-vol:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.zitadel.loadbalancer.server.port=8080
      - traefik.http.services.zitadel.loadbalancer.server.scheme=h2c
      # Zitadel API: only matches Zitadel's own endpoints (OIDC, OAuth, management, etc.).
      # Everything else falls through to the frontend SPA catch-all.
      - traefik.http.routers.zitadel-web.rule=PathPrefix(`/.well-known`) || PathPrefix(`/oauth`) || PathPrefix(`/oidc`) || PathPrefix(`/saml`) || PathPrefix(`/v2`) || PathPrefix(`/management`) || PathPrefix(`/admin`) || PathPrefix(`/auth/v1`) || PathPrefix(`/assets`) || PathPrefix(`/ui/console`) || PathPrefix(`/debug`) || PathPrefix(`/zitadel.`)
      - traefik.http.routers.zitadel-web.entrypoints=web
      - traefik.http.routers.zitadel-web.service=zitadel
      - traefik.http.routers.zitadel-web.priority=100
      - traefik.http.middlewares.zitadel-fwd.headers.customrequestheaders.X-Forwarded-Host=localhost:${TRAEFIK_EXPOSED_PORT}
      - traefik.http.middlewares.zitadel-fwd.headers.customrequestheaders.X-Forwarded-Proto=http
      - traefik.http.routers.zitadel-web.middlewares=zitadel-fwd

  init-codegen:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      DATABASE_URL: "postgresql://dummy"
      # ☝️ this variable is necessary to generate the Prisma client
    volumes:
      - .:/app
    entrypoint:
      - /bin/sh
      - -c
      - npx nx codegen frontend

  init-zitadel-pat-vol:
    image: busybox:1.37
    volumes:
      - zitadel-pat:/zitadel-pat
    entrypoint: ["sh", "-c", "chmod 1777 /zitadel-pat"]

  setup-zitadel:
    image: node:24.14-bookworm-slim
    environment:
      # Route through Traefik so the Host header is always "localhost".
      ZITADEL_URL: http://traefik:80
      ZITADEL_APP_NAME: ${SERVICE_NAME}
    networks:
      - proxy
      - default
    depends_on:
      traefik:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./local-setup/setup-zitadel:/app:ro
      - zitadel-pat:/zitadel-pat
    entrypoint: ["npm", "start"]

  redis:
    image: redis:8.6-alpine3.23
    restart: always
    command: ["/bin/sh", "/app/start-redis.sh"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    env_file:
      - ./.env
    volumes:
      - ./local-setup/start-redis.sh:/app/start-redis.sh:ro
    deploy:
      resources:
        limits:
          memory: 640M
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG;
        else
          redis-cli ping | grep PONG;
        fi'
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    build:
      context: local-setup/ollama
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  qwen-tts:
    build:
      context: local-setup/qwen-tts
      dockerfile: Dockerfile
      args:
        QWEN_TTS_MODEL: ${QWEN_TTS_MODEL}
    profiles:
      - dev
      - backend-e2e
      - frontend-e2e
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  tts:
    image: 9109679196/piper-tts-rest-api:3.0.0
    user: "1000:1000"
    environment:
      PIPER_MODEL: /app/models/en_US-lessac-medium.onnx
      PORT: 3000
      LOGGING_MODE: "JSON"
      NODE_ENV: "production"
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      SERVICE_NAME: piper-tts-rest-api
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG}
      OTEL_BATCH_MAX_PENDING_SPANS: ${OTEL_BATCH_MAX_PENDING_SPANS}
      OTEL_BATCH_SPANS_PER_EXPORT: ${OTEL_BATCH_SPANS_PER_EXPORT}
      OTEL_BATCH_FLUSH_INTERVAL_MS: ${OTEL_BATCH_FLUSH_INTERVAL_MS}
      OTEL_BATCH_EXPORT_TIMEOUT_MS: ${OTEL_BATCH_EXPORT_TIMEOUT_MS}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beatrice:
    image: 9109679196/smart-novel-beatrice:3.0.0
    profiles:
      - dev
      - backend-e2e
      - frontend-e2e
    environment:
      PORT: 3000
      SERVICE_NAME: beatrice
      LLM__BASE_URL: http://ollama:11434/v1
      LLM__API_KEY: ollama
      LLM__MODEL: ${OLLAMA_MODEL}
      LLM__TIMEOUT_MS: 150000
      LOGGING__MODE: JSON
      LOGGING__LEVEL: info
      OTEL__ENABLED: ${OTEL_ENABLED}
      OTEL__EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL__TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER}
      RABBITMQ__CONNECTION_STRING: amqp://guest:guest@rabbitmq:5672/
      GENERATE_AUDIO__CALLBACK__ALLOWED_HOSTS: backend,backend-e2e
      TTS__QWEN__BASE_URL: http://qwen-tts:8001
    depends_on:
      ollama:
        condition: service_healthy
      otel-collector:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      qwen-tts:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles:
      - dev
      - backend-e2e
      - frontend-e2e
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles:
      - dev
      - backend-e2e
      - frontend-e2e
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./local-setup/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - 4318:4318 # OTLP HTTP -- Apps point OTEL_EXPORTER_OTLP_ENDPOINT here
      - 4317:4317 # OTLP gRPC -- Apps push traces via gRPC to this port
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.otel-collector.loadbalancer.server.port=4318
      # Browser-originated OTLP/HTTP exports — same-origin (port 8080) so no CORS preflight is needed.
      - traefik.http.routers.otel-collector-web.rule=PathPrefix(`/v1/traces`)
      - traefik.http.routers.otel-collector-web.entrypoints=web
      - traefik.http.routers.otel-collector-web.service=otel-collector
      - traefik.http.routers.otel-collector-web.priority=300

  otel-healthcheck:
    image: busybox:1.37
    profiles:
      - dev
      - backend-e2e
      - frontend-e2e
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - sh
      - -eu
      - -c
      - |
        for i in $$(seq 1 60); do
          if wget -S -qO- --timeout=3 http://otel-collector:13133/ 2>&1; then
            echo "otel-collector is healthy after $$i attempt(s)"
            exit 0
          fi
          echo "[$$i/60] otel-collector not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "ERROR: otel-collector did not become healthy within 120s" >&2
        exit 1

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles:
      - dev
      - backend-e2e
      - frontend-e2e
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:14269"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  s3:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z-cpuv1
    ports:
      - ${S3_PORT:-9000}:9000
      - 9001:9001 # Dashboard
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 3

  init-s3:
    image: minio/mc
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    volumes:
      - ./apps/backend/data:/source-data
      - ./local-setup/bucket-policy.json:/bucket-policy.json:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/mc alias set my_minio http://s3:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        /usr/bin/mc admin info my_minio
        /usr/bin/mc mb my_minio/smart-novel || true
        for file in /source-data/**/*.png /source-data/**/**/*.png; do
          [ -f "$$file" ] && /usr/bin/mc cp "$$file" my_minio/smart-novel/covers/
        done
        /usr/bin/mc anonymous set-json /bucket-policy.json my_minio/smart-novel
        echo 'MinIO initialization complete!'

networks:
  proxy:
    name: proxy

volumes:
  zitadel-pat:
